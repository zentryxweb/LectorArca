<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lector de Archivo de Alícuotas</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f4;
            margin: 0;
            padding: 20px;
        }
        .contenedor {
            background-color: #fff;
            padding: 25px;
            border-radius: 12px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            max-width: 900px;
            margin: auto;
        }
        h1 {
            color: #333;
            margin-bottom: 15px;
            font-size: 22px;
            text-align: center;
        }
        p {
            text-align: center;
            margin-bottom: 20px;
        }
        a button {
            padding: 10px 20px;
            margin-bottom: 20px;
            background: linear-gradient(135deg, #007bff, #0056b3);
            color: #fff;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            font-weight: bold;
            transition: all 0.3s ease;
        }
        a button:hover {
            background: linear-gradient(135deg, #0056b3, #003f7f);
            transform: translateY(-2px);
            box-shadow: 0 6px 12px rgba(0, 0, 0, 0.15);
        }
        input[type="file"] {
            display: block;
            margin: 0 auto 20px auto;
        }
        .tabla-contenedor {
            overflow-x: auto;
        }
        #output {
            border-collapse: collapse;
            width: 100%;
            margin-top: 20px;
            font-size: 14px;
        }
        #output th, #output td {
            border: 1px solid #ccc;
            padding: 8px 12px;
            text-align: center;
        }
        #output th {
            background-color: #007bff;
            color: #fff;
        }
        #output tr:nth-child(even) {
            background-color: #f9f9f9;
        }
    </style>
</head>
<body>

    <div class="contenedor">
        <a href="index.html"><button>⬅ Volver al Menú</button></a>

        <h1>Lectura de Archivo de Alícuotas</h1>
        <p>Selecciona un archivo <strong>alicuotas.txt</strong> para visualizarlo en tabla.</p>
        
        <input type="file" id="archivoInput" accept=".txt">
        
        <div class="tabla-contenedor">
            <table id="output"></table>
        </div>
    </div>

    <script>
        document.getElementById('archivoInput').addEventListener('change', handleFile, false);

        function handleFile(e) {
            const archivo = e.target.files[0];
            if (!archivo) return;

            const reader = new FileReader();
            reader.onload = function(e) {
                const data = e.target.result;
                const lineas = data.split('\n').filter(linea => linea.trim() !== '');

                const headers = ["TIPO_DOC", "PTO_VENTA", "NRO", "IMP_GRAVADO", "PORC_IVA", "IMP_IVA"];

                const rows = lineas.map(linea => {
                    const row = [];
                    let pos = 0;
                    
                    row.push(linea.substring(pos, pos + 3)); pos += 3;
                    row.push(linea.substring(pos, pos + 5)); pos += 5;
                    row.push(linea.substring(pos, pos + 20)); pos += 20;
                    row.push(linea.substring(pos, pos + 15)); pos += 15;
                    row.push(linea.substring(pos, pos + 4)); pos += 4;
                    row.push(linea.substring(pos, pos + 15)); pos += 15;

                    return row;
                });
                
                displayTable(headers, rows);
            };
            reader.readAsText(archivo);
        }

        function displayTable(headers, rows) {
            const outputTable = document.getElementById('output');
            outputTable.innerHTML = '';

            const thead = outputTable.createTHead();
            const headerRow = thead.insertRow();
            headers.forEach(headerText => {
                const th = document.createElement('th');
                th.textContent = headerText;
                headerRow.appendChild(th);
            });

            const tbody = document.createElement('tbody');
            outputTable.appendChild(tbody);

            rows.forEach(row => {
                const tr = tbody.insertRow();
                row.forEach(cellData => {
                    const td = tr.insertCell();
                    td.textContent = cellData.trim();
                });
            });
        }
    </script>
</body>
</html>
